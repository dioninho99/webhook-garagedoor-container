apiVersion: apps/v1
kind: Deployment
metadata:
  name: modbus-garagedoor-webhook
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modbus-garagedoor-webhook
  template:
    metadata:
      labels:
        app: modbus-garagedoor-webhook
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: webhook
          image: ghcr.io/dioninho99/modbus-garagedoor-webhook:1.0
          ports:
            - containerPort: 5001
          env:
            - name: FLASK_ENV
              value: production
            - name: TZ
              value: Europe/Zurich
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: modbus-garagedoor-webhook
  namespace: default
spec:
  type: NodePort
  selector:
    app: modbus-garagedoor-webhook
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30501